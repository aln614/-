name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match package.json version v$version."
          }
          Write-Host "Building TENYING_AI $version"

      - name: Validate JavaScript
        run: npm run check

      - name: Build portable EXE
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build LAN client EXE
        run: npm run lan-client:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify release EXE
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $lanVersion = (Get-Content lan-client/package.json -Raw | ConvertFrom-Json).version
          $exe = Get-Item -LiteralPath "dist/TENYING_AI-$version-win-x64.exe"
          if ($exe.Length -lt 1000000) { throw "Release EXE is unexpectedly small: $($exe.Length) bytes." }
          Write-Host "Release EXE: $($exe.FullName) ($($exe.Length) bytes)"
          $lanClientExe = Get-Item -LiteralPath "lan-client/dist/TENYING_AI_LAN_Client-$lanVersion-win-x64.exe"
          if ($lanClientExe.Length -lt 1000000) { throw "LAN client EXE is unexpectedly small: $($lanClientExe.Length) bytes." }
          Write-Host "LAN client EXE: $($lanClientExe.FullName) ($($lanClientExe.Length) bytes)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalApiImageGenerator-windows
          path: |
            dist/*.exe
            lan-client/dist/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            lan-client/dist/*.exe
          generate_release_notes: true
