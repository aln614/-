name: Build Windows and macOS Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-release:
    if: >-
      github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'release: v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        id: version
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          VERSION="$(node -e 'process.stdout.write(require("./package.json").version)')"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Release tag must match package.json version v$VERSION." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_EVENT_NAME" == "push" && "$COMMIT_MESSAGE" != "release: v$VERSION" ]]; then
            echo "Release commit message must be release: v$VERSION." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare-release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag must match package.json version v$version."
          }
          Write-Host "Building TENYING_AI $version"

      - name: Validate JavaScript
        run: npm run check

      - name: Build portable EXE
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Build LAN client EXE
        run: npm run lan-client:dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify release EXE
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $lanVersion = (Get-Content lan-client/package.json -Raw | ConvertFrom-Json).version
          $exe = Get-Item -LiteralPath "dist/TENYING_AI-$version-win-x64.exe"
          if ($exe.Length -lt 1000000) { throw "Release EXE is unexpectedly small: $($exe.Length) bytes." }
          Write-Host "Release EXE: $($exe.FullName) ($($exe.Length) bytes)"
          $lanClientExe = Get-Item -LiteralPath "lan-client/dist/TENYING_AI_LAN_Client-$lanVersion-win-x64.exe"
          if ($lanClientExe.Length -lt 1000000) { throw "LAN client EXE is unexpectedly small: $($lanClientExe.Length) bytes." }
          Write-Host "LAN client EXE: $($lanClientExe.FullName) ($($lanClientExe.Length) bytes)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalApiImageGenerator-windows
          path: |
            dist/*.exe
            lan-client/dist/*.exe

  build-macos:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check release version
        shell: bash
        run: |
          VERSION="$(node -e 'process.stdout.write(require("./package.json").version)')"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Release tag must match package.json version v$VERSION." >&2
            exit 1
          fi
          echo "Building TENYING_AI $VERSION for macOS ${{ matrix.arch }}"

      - name: Validate JavaScript
        run: npm run check

      - name: Validate macOS packaging configuration
        run: npm run check:macos

      - name: Build macOS DMG and ZIP
        run: |
          npm run prepare:mac-icon
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --config.directories.output=dist-macos --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify macOS release packages
        shell: bash
        run: |
          VERSION="$(node -e 'process.stdout.write(require("./package.json").version)')"
          for extension in dmg zip; do
            FILE="dist-macos/TENYING_AI-${VERSION}-mac-${{ matrix.arch }}.${extension}"
            test -s "$FILE" || { echo "Missing macOS package: $FILE" >&2; exit 1; }
            echo "Built $FILE ($(stat -f%z "$FILE") bytes)"
          done

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalApiImageGenerator-macos-${{ matrix.arch }}
          path: dist-macos/TENYING_AI-*-mac-${{ matrix.arch }}.*
          if-no-files-found: error

  publish-release:
    if: >-
      github.event_name == 'push' && (github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'release: v'))
    needs: [prepare-release, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: LocalApiImageGenerator-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare-release.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          generate_release_notes: true
